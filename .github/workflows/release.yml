# Creates an empty draft release as github-actions, so the release page is not signed by a person.
# The builds are uploaded to the draft afterwards (gh release upload), then the draft is published.
name: release draft
on:
  workflow_dispatch:
    inputs:
      tag: { description: "Tag, e.g. v0.1.1", required: true }
      title: { description: "Title", required: true }
      notes: { description: "Release notes (markdown)", required: true }
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "$TITLE" --notes "$NOTES"
