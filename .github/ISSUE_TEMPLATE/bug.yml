name: Bug report
description: Something in Aerless Code doesn't work
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run aerless in ...\n2. ..."
  - type: input
    attributes:
      label: Version and system
      description: Output of `aerless --version`, and your OS.
      placeholder: aerless 0.2.4, macOS 15 arm64
    validations:
      required: true
